; Edit this file and use the demo's Reload UI action to apply changes.
; Choose another file at startup with DF_UI_CONFIG=path/to/file.ini.
; Presets: dark, light, slate, ocean, forest, rose, template.
; Values omitted here inherit the selected preset's defaults.
; Keys are case-sensitive. Full-line # and ; comments are accepted;
; use ; for inline comments. Invalid files leave the active theme unchanged.

[theme]
preset = dark

[metrics]
buttonHeight = 30               ; 18..96 pixels
controlHeight = 32              ; 18..96 pixels
tabBarHeight = 32               ; 20..96 pixels (dock tabs and content tabs)
rowHeight = 34                  ; 18..128 pixels
spacing = 10                    ; 0..40 pixels
scrollbarWidth = 10             ; 6..32 pixels
scrollStep = 34                 ; 8..240 pixels per wheel step
cornerRadius = 4                ; 0..48; buttons, controls, tabs and client area
clientAreaCornerRadius = 3      ; specific radii override cornerRadius
; buttonCornerRadius = 4
; controlCornerRadius = 4
; tabCornerRadius = 4
; tabShoulderWidth = 6          ; 0..32
; tabLiftPx = 4                 ; 0..20
; tabFontScale = 0.9            ; 0.5..2
; fontPixelScale = 1.4          ; 1..4
; splitterHandleScale = 1.1     ; 0.5..3
; clientAreaPadding = 2         ; 0..32
; tabClientAreaExtraPadding = 0 ; 0..32
; clientAreaBorderThickness = 1 ; 0..8

[colors]
; Optional #RRGGBB overrides retain the preset's alpha/transparency.
; tabAccent = #68B5FF
; controlFill = #303946
; selection = #234C70
; text = #EDF2F7
; mutedText = #A6B2C2
; All DockTheme color fields are accepted by name, including titleBar,
; dockBackground, dockBorder, floatingFrame, floatingCloseButton, tabStrip,
; tabActive, tabInactive, tabOutline, tabTextActive, tabTextInactive,
; splitter, splitterHandle, splitterHover, splitterDrag, overlayPanel,
; overlayAccent, overlayAccentSoft, clientAreaFill, clientAreaBorder, success.

[features]
; Boolean values: true, false, 1, 0.
smoothFont = true
drawRoundedClientArea = true
drawTabAccent = true
; drawClientArea = true
; drawClientAreaBorder = false
; drawSplitter = true
; drawSplitterStateColors = true
; drawSplitterGuideLines = false
; drawTitleBarIcons = true
; drawUndockIcon = false
; drawWidgetHoverOutline = false
; drawSteppedTabShape = false
