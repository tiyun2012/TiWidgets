; Spacious, rounded controls. Launch with DF_UI_CONFIG=config/rounded.ini.
[theme]
preset = ocean

[metrics]
buttonHeight = 40
controlHeight = 40
tabBarHeight = 40
rowHeight = 44
spacing = 14
cornerRadius = 12
tabCornerRadius = 9
scrollbarWidth = 12
scrollStep = 44
fontPixelScale = 1.6

[features]
drawRoundedClientArea = true
drawClientAreaBorder = true
drawTabAccent = true
