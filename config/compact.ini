; Dense, square controls. Launch with DF_UI_CONFIG=config/compact.ini.
[theme]
preset = slate

[metrics]
buttonHeight = 24
controlHeight = 26
tabBarHeight = 26
rowHeight = 28
spacing = 6
cornerRadius = 0
scrollbarWidth = 8
scrollStep = 28
fontPixelScale = 1.2

[features]
drawRoundedClientArea = false
drawTabAccent = true
